<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockup Base</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111827;
        color: #f9fafb;
      }
      .card {
        max-width: 640px;
        padding: 2rem;
        margin: 1rem;
        border-radius: 12px;
        background: #1f2937;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      h1 { margin-top: 0; }
      code {
        display: inline-block;
        padding: 0.2rem 0.45rem;
        border-radius: 6px;
        background: #111827;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Your mockup server is ready</h1>
      <p>
        Put your HTML/CSS/JS assets in the <code>public/</code> folder.
      </p>
      <p>
        Start the server with <code>npm start</code> and open <code>http://localhost:3000</code>.
      </p>
    </main>
  </body>
</html>
